events {
    worker_connections 1024;
}

http {
    gzip on;
    gzip_types text/plain text/css application/json application/javascript;

    upstream node_backend {
        server agentflou-node:3000;
    }

    # ==================== HTTP → HTTPS Redirección ====================
    server {
        listen 80;
        server_name agentflou.com www.agentflou.com;

        # Redirige todo el tráfico HTTP a HTTPS
        return 301 https://$host$request_uri;
    }

    # ==================== HTTPS (SSL) ====================
    server {
        listen 443 ssl;
        server_name agentflou.com www.agentflou.com;

        # Certificados de Let's Encrypt
        ssl_certificate     /etc/letsencrypt/live/agentflou.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/agentflou.com/privkey.pem;

        # Configuración SSL recomendada
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        # Headers de seguridad
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # Todo el tráfico va al Node.js (SSR de React Router)
        location / {
            proxy_pass http://node_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
        }
    }
}
