version: '3.9'

services:
  node:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agentflou-node
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      - NODE_ENV=production

  nginx:
    image: nginx:alpine
    container_name: agentflou-nginx
    restart: unless-stopped
    ports:
      - "80:80"        # Cambia a "8080:80" si prefieres otro puerto
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - node
